<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University API{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #333; }
        nav { background: #1a73e8; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        nav a { color: white; text-decoration: none; font-weight: 500; }
        nav a:hover { text-decoration: underline; }
        nav .brand { font-size: 1.2rem; font-weight: 700; }
        .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background: #f8f9fa; font-weight: 600; }
        tr:hover { background: #f5f5f5; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #b02a37; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #565e64; }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        input, select { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; }
        .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .form-row label { display: flex; flex-direction: column; gap: 0.25rem; }
        .actions { display: flex; gap: 0.5rem; }
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .hub-card { background: white; border-radius: 8px; padding: 2rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-decoration: none; color: #333; transition: transform 0.2s, box-shadow 0.2s; }
        .hub-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .hub-card h2 { margin-bottom: 0.5rem; color: #1a73e8; }
        .hub-card p { color: #666; }
        h1 { margin-bottom: 1rem; }
        .mt-1 { margin-top: 1rem; }
        .hidden { display: none; }
        .toast { position: fixed; bottom: 1rem; right: 1rem; padding: 1rem 1.5rem; border-radius: 4px; color: white; font-weight: 500; z-index: 1000; animation: fadeIn 0.3s; }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">University API</a>
        <a href="/students">Students</a>
        <a href="/subjects">Subjects</a>
        <a href="/grades">Grades</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
