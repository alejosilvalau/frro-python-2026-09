{% extends 'base.html' %}

{% block title %}Nueva Condición - PortfolioAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header"><h4 class="mb-0">Nueva condición de alerta</h4></div>
            <div class="card-body">
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="indicator_id" class="form-label">Indicador</label>
                        <select id="indicator_id" name="indicator_id" class="form-select" required>
                            <option value="">Seleccionar indicador...</option>
                            {% for indicator in indicators %}
                            <option value="{{ indicator.id }}">{{ indicator.name }}{% if indicator.period %} ({{ indicator.period }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="operator" class="form-label">Operador</label>
                        <select id="operator" name="operator" class="form-select" required>
                            {% for value, label in operators %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="threshold_value" class="form-label">Valor umbral</label>
                        <input id="threshold_value" name="threshold_value" type="number" step="0.0001" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear condición</button>
                </form>
                <div class="mt-3 text-center"><a href="{% url 'alerts:condition_list' %}">Volver a condiciones</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
