{% if position.stock.tipo == 'accion' or position.stock.tipo == 'cedear' %}
<section class="card price-chart mb-4">
    <div class="card-header py-3 px-4">
        <h2 class="h6 mb-0">Precio histórico · {{ position.stock.ticker }}</h2>
    </div>
    <div class="card-body p-0">
        <div class="tradingview-widget-container">
            <div id="tv_chart"></div>
            <script src="https://s3.tradingview.com/tv.js"></script>
            <script>
                new TradingView.widget({
                    "width": "100%",
                    "height": 450,
                    "symbol": "{% if position.stock.tipo == 'accion' %}BYMA:{% endif %}{{ position.stock.ticker }}",
                    "interval": "D",
                    "timezone": "America/Argentina/Buenos_Aires",
                    "theme": "dark",
                    "style": "1",
                    "locale": "es",
                    "enable_publishing": false,
                    "allow_symbol_change": false,
                    "save_image": false,
                    "container_id": "tv_chart"
                });
            </script>
        </div>
    </div>
</section>
{% endif %}
