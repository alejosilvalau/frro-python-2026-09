{% extends 'base.html' %}

{% block title %}Nueva Compra - PortfolioAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Nueva Compra &mdash; {{ position.stock.ticker }}</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Pagar con</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="purchase_currency" id="pc_ars" value="ARS" checked>
                                <label class="form-check-label" for="pc_ars">
                                    Pesos (ARS) &mdash; <span class="text-success fw-bold">Disponible: ${{ available_ars|floatformat:2 }}</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="purchase_currency" id="pc_usd" value="USD">
                                <label class="form-check-label" for="pc_usd">
                                    Dólares (USD) &mdash; <span class="text-primary fw-bold">Disponible: U$D {{ available_usd|floatformat:2 }}</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="amount" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="amount" name="amount" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="price_local" class="form-label">Precio (Local)</label>
                            <input type="number" class="form-control" id="price_local" name="price_local" step="0.01" min="0.01" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="price_usd" class="form-label">Precio (USD)</label>
                            <input type="number" class="form-control" id="price_usd" name="price_usd" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <div id="cost-display" class="alert alert-info d-none mb-3 py-2">
                        Costo total: <strong id="cost-value">-</strong>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="purchased_at" class="form-label">Fecha de compra</label>
                            <input type="datetime-local" class="form-control" id="purchased_at" name="purchased_at" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fees" class="form-label">Comisiones <small class="text-muted">(informativo, no afecta el P&L)</small></label>
                            <input type="number" class="form-control" id="fees" name="fees" step="0.01" min="0" value="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registrar compra</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'portfolio:position_detail' position.id %}">Volver a la posición</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const availableARS = parseFloat('{{ available_ars|default:"0" }}') || 0;
const availableUSD = parseFloat('{{ available_usd|default:"0" }}') || 0;

function updateCostDisplay() {
    const costDisplay = document.getElementById('cost-display');
    const amountEl = document.getElementById('amount');
    const currencyEl = document.querySelector('input[name="purchase_currency"]:checked');
    if (!costDisplay || !amountEl || !currencyEl) return;

    const qty = parseFloat(amountEl.value) || 0;
    const currency = currencyEl.value;
    const price = currency === 'ARS'
        ? (parseFloat(document.getElementById('price_local').value) || 0)
        : (parseFloat(document.getElementById('price_usd').value) || 0);
    const available = currency === 'ARS' ? availableARS : availableUSD;
    const cost = qty * price;

    if (qty > 0 && price > 0) {
        costDisplay.classList.remove('d-none');
        const fmt = cost.toLocaleString('es-AR', { minimumFractionDigits: 2 });
        const sym = currency === 'ARS' ? '$' : 'U$D ';
        document.getElementById('cost-value').textContent = `${sym}${fmt}`;
        if (cost > available) {
            costDisplay.classList.replace('alert-info', 'alert-danger');
        } else {
            costDisplay.classList.replace('alert-danger', 'alert-info');
        }
    } else {
        costDisplay.classList.add('d-none');
    }
}

document.getElementById('amount').addEventListener('input', updateCostDisplay);
document.getElementById('price_local').addEventListener('input', updateCostDisplay);
document.getElementById('price_usd').addEventListener('input', updateCostDisplay);
document.querySelectorAll('input[name="purchase_currency"]').forEach(r => r.addEventListener('change', updateCostDisplay));
</script>
{% endblock %}
