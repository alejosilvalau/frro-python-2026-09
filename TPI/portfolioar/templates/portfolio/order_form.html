{% extends 'base.html' %}

{% block title %}Nueva Orden - PortfolioAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Nueva Orden</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="amount" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="amount" name="amount" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fulfill_datetime" class="form-label">Fecha de ejecución</label>
                            <input type="datetime-local" class="form-control" id="fulfill_datetime" name="fulfill_datetime" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="total_fees" class="form-label">Comisiones</label>
                            <input type="number" class="form-control" id="total_fees" name="total_fees" step="0.01" min="0" value="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="price_local" class="form-label">Precio (Local)</label>
                            <input type="number" class="form-control" id="price_local" name="price_local" step="0.01" min="0.01" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="price_usd" class="form-label">Precio (USD)</label>
                            <input type="number" class="form-control" id="price_usd" name="price_usd" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear orden</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'portfolio:position_list' %}">Volver a posiciones</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
