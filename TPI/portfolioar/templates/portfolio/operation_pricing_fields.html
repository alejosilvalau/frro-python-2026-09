<fieldset class="border rounded p-3 mb-3"><legend class="float-none w-auto px-2 fs-6">Precio de operación{% if position.stock.tipo == 'bono' or position.stock.tipo == 'letra' %} (cada 100 VN){% endif %}</legend>
  <div class="mb-3"><label class="form-label me-3">Editar en</label><label class="form-check form-check-inline"><input class="form-check-input" type="radio" name="price_editor_currency" value="ARS" checked> ARS</label><label class="form-check form-check-inline"><input class="form-check-input" type="radio" name="price_editor_currency" value="USD"> USD</label></div>
  <div class="row"><div class="col-md-6 mb-3"><label for="price_ars" class="form-label">Precio ARS</label><input id="price_ars" type="number" step="0.0001" min="0.0001" class="form-control"></div><div class="col-md-6 mb-3"><label for="price_usd" class="form-label">Precio USD</label><input id="price_usd" type="number" step="0.0001" min="0.0001" class="form-control" readonly></div></div>
  <input type="hidden" id="price" name="price"><input type="hidden" id="price_input_currency" name="price_input_currency" value="ARS"><input type="hidden" id="client_ccl_rate" name="client_ccl_rate"><small id="price-status" class="text-muted"></small><span id="ccl-badge" class="ms-2 badge bg-secondary"></span>
  <div class="mb-3 d-none"><label for="manual_ccl_rate" class="form-label">CCL manual</label><input id="manual_ccl_rate" name="manual_ccl_rate" type="number" step="0.0001" min="0.0001" class="form-control"><small class="text-muted">No había CCL disponible para esta fecha.</small></div>
</fieldset>
<div id="operation-total" class="alert alert-info d-none">Total de la operación: <strong></strong></div>
