{% extends 'base.html' %}

{% block title %}Cambiar contraseña - PortfolioAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Cambiar contraseña</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Contraseña actual</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nueva contraseña</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password_confirm" class="form-label">Confirmar nueva contraseña</label>
                        <input type="password" class="form-control" id="new_password_confirm" name="new_password_confirm" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'core:profile' %}">Volver al perfil</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
